name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'EngoDev/pi-switchyard'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a release commit on main
        run: git merge-base --is-ancestor HEAD origin/main

      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # OIDC trusted publishing requires npm >=11.5.1.
      - name: Install OIDC-capable npm
        run: npm install --global npm@11
      - run: pnpm install --frozen-lockfile

      - name: Validate release version and channel
        id: release
        run: pnpm exec tsx scripts/check-release.ts

      - run: pnpm check
      - run: pnpm check:package-load
      - run: pnpm check:packed-package

      # Checks above cover prepublishOnly. No NPM_TOKEN/NODE_AUTH_TOKEN is needed.
      - name: Publish with npm trusted publishing
        env:
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
        run: npm publish --access public --provenance --ignore-scripts --tag "$NPM_TAG"
